<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lobby Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #00ff00; }
        input, button { padding: 10px; margin: 5px 0; background: #333; border: 1px solid #555; color: white; }
        #logs { margin-top: 20px; padding: 10px; border: 1px solid #555; height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>🚀 SFU Lobby Tester</h2>
    <input id="roomId" type="text" placeholder="Room ID (e.g., room1)" value="room1">
    <input id="username" type="text" placeholder="Your Name">
    <button onclick="join()">Join Room</button>
    <button onclick="disconnect()">Disconnect</button>

    <div id="logs"></div>

    <script>
        let socket;
        const log = (msg) => {
            document.getElementById("logs").innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        };

        function join() {
            const roomId = document.getElementById('roomId').value;
            const name = document.getElementById('username').value || 'Anonymous';
            
            // Connect to your server
            socket = io("http://localhost:3000"); 

            socket.on("connect", () => {
                log(`🟢 Connected: ${socket.id}`);
                // Fire Phase 2 logic
                socket.emit("joinRoom", { roomId, name });
            });

            socket.on("existing-users", (peers) => {
                log(`👥 Existing peers: ${JSON.stringify(peers)}`);
            });

            socket.on("user-joined", (peer) => {
                log(`👋 User joined: ${JSON.stringify(peer)}`);
            });

            socket.on("user-left", ({ peerId }) => {
                log(`🚪 User left: ${peerId}`);
            });

            socket.on("disconnect", () => {
                log("🔴 Disconnected");
            });
        }

        function disconnect() {
            if (socket) socket.disconnect();
        }
    </script>
</body>
</html>
